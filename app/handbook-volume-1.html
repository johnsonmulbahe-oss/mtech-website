const SB=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','sb_publishable_vQULGJJZNtuT_MZCSqomiQ_URYS4BQp');const book=document.getElementById('book');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let PAGE=0;const pages=[];function page(title,html,cls=''){PAGE++;pages.push(`<section class="page ${cls}"><div class="owner">Owned by M-TECH Solution Liberia Ltd.</div>${html}<div class="footer"><span>M-TECH · With God We Build Solutions</span><span>Page ${PAGE} of 70</span></div></section>`)}function bullets(items){return `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}function para(t){return `<p>${esc(t)}</p>`}function textOf(){const d=document.createElement('div');d.innerHTML=pages.join('');return d.innerText}function save(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function build(){const [{data:paths},{data:mods}]=await Promise.all([SB.from('hub_learning_paths').select('*').eq('active',true).order('sort_order'),SB.from('hub_learning_modules').select('*').order('sort_order')]);const P=paths||[],M=mods||[];PAGE=0;pages.length=0;page('',`<img src="../mtech-logo.png" alt="M-TECH"><div class="kicker" style="color:#80e8ff">M-TECH Problem Solving & Innovation Hub</div><h1>M-TECH Skills, Problem Solving & Innovation Handbook</h1><h2>Volume 1 · 70-Page Live Study Edition</h2><p style="font-size:16px">A practical learning, technology, business, innovation and problem-solving reference.</p><p><b>Mulbah Technology Solution Liberia Ltd.</b></p><p>Monrovia, Liberia · 0773330241 · 0772741860 · 0555387355</p><p style="margin-top:40px;font-style:italic">With God We Build Solutions</p>`,'cover');page('Ownership & Publication',`<div class="kicker">Publication Information</div><h1>Ownership, Use & Publication</h1><div class="callout"><b>Owned by M-TECH Solution Liberia Ltd.</b><br>This handbook is an official M-TECH learning and innovation resource.</div>${para('The handbook is designed for students, technicians, entrepreneurs, collaborators, institutions and members of the M-TECH Problem Solving & Innovation Hub. It may be used for learning, training, internal workshops and approved educational collaboration.')}${para('Content should be applied responsibly. Cybersecurity material is intended for defensive, authorized and ethical learning. Technical procedures should be tested safely before use in production environments.')}<h2>Edition</h2>${para('Volume 1 · Live Digital Edition · 2026')}<h2>Branding</h2>${para('All pages carry the M-TECH ownership statement and official logo watermark so printed and saved copies remain identifiable.')}`);page('About M-TECH',`<div class="kicker">About</div><h1>About M-TECH</h1>${para('M-TECH — Mulbah Technology Solution Liberia Ltd. — provides practical technology solutions, learning support and problem-solving services. The company combines technology, education, innovation and business thinking to help individuals and organizations move from problems to workable solutions.')}<div class="grid"><div class="box"><h3>Mission in this handbook</h3>${bullets(['Make technical ideas understandable','Connect theory to practical work','Encourage responsible innovation','Build repeatable problem-solving habits'])}</div><div class="box"><h3>How to learn</h3>${bullets(['Read actively','Practice each skill','Document mistakes and fixes','Build mini-projects','Teach another learner'])}</div></div><h2>Motto</h2><div class="callout"><b>With God We Build Solutions</b></div>`);page('How to Use This Book',`<div class="kicker">Study Guide</div><h1>How to Use This Handbook</h1>${para('This book is arranged as a learning journey rather than a collection of isolated notes. Every chapter moves from understanding to practice, troubleshooting, exercises and review.')} ${bullets(['Start with the chapter overview and objectives.','Read the core lesson notes and rewrite key ideas in your own words.','Complete the practical activity using a safe test environment.','Use the troubleshooting page when your result differs from the expected result.','Answer the review questions without looking back first.','Record useful solutions in the M-TECH Knowledge Bank.'])}<h2>Suggested study rhythm</h2>${para('Use one chapter over several sessions. A learner may read theory on one day, perform the practical activity on another, and complete the review later.')}`);page('Table of Contents',`<div class="kicker">Contents</div><h1>Table of Contents</h1>${P.map((p,i)=>`<div class="toc-row"><span>Chapter ${i+1}: ${esc(p.title)}</span><span>${7+i*7}</span></div>`).join('')}<div class="toc-row"><span>Innovation Lab Framework</span><span>63</span></div><div class="toc-row"><span>Project Workbook</span><span>64</span></div><div class="toc-row"><span>Assessment & Skills Rubric</span><span>65</span></div><div class="toc-row"><span>Problem-Solving Toolkit</span><span>66</span></div><div class="toc-row"><span>Glossary</span><span>67</span></div><div class="toc-row"><span>Review & Answer Guidance</span><span>68</span></div><div class="toc-row"><span>Personal Action Plan</span><span>69</span></div><div class="toc-row"><span>Closing & Resources</span><span>70</span></div>`);page('Learning Roadmap',`<div class="kicker">Roadmap</div><h1>Learning Roadmap</h1>${para('The eight learning paths support both academic development and real M-TECH problem-solving work. The recommended order is flexible, but learners should build strong fundamentals before attempting advanced projects.')}<div class="grid">${P.map((p,i)=>`<div class="box"><span class="badge">${i+1}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><small>${esc(p.level||'All Levels')}</small></div>`).join('')}</div>`);
P.slice(0,8).forEach((p,ci)=>{const ms=M.filter(m=>m.path_id===p.id);const base=ms.map(m=>m.content||'').join('\n\n');const snippets=ms.length?ms:[{title:'Core Concepts',content:p.description||''}];page('',`<div class="kicker">Chapter ${ci+1}</div><h1>${esc(p.title)}</h1><p><span class="badge">${esc(p.level||'All Levels')}</span></p>${para(p.description||'')}<h2>Chapter objectives</h2>${bullets(['Understand the major concepts and vocabulary.','Connect the topic to practical M-TECH or academic work.','Apply the ideas through a controlled hands-on task.','Recognize common mistakes and troubleshoot systematically.','Explain the topic clearly to another learner.'])}<div class="callout"><b>Problem-solving focus:</b> Do not memorize steps only. Understand why each step is performed and what evidence confirms that it worked.</div>`);page('',`<div class="kicker">Chapter ${ci+1} · Core Notes</div><h1>Core Concepts & Notes</h1>${snippets.map((m,i)=>`<h2>${i+1}. ${esc(m.title)}</h2><div class="note">${esc(m.content||'')}</div>`).join('')}`);page('',`<div class="kicker">Chapter ${ci+1} · Applied Learning</div><h1>Practical Applications</h1>${para('Turn the chapter into observable work. Before changing anything important, record the starting condition. After the change, record the result. This creates evidence instead of relying on memory.')}${bullets(['Choose a small safe example related to this chapter.','State the expected outcome before beginning.','Perform one meaningful change at a time.','Capture screenshots, measurements, formulas, configuration values or observations.','Compare actual versus expected results.','Record the final working method in your notes or Knowledge Bank.'])}<h2>M-TECH field connection</h2>${para('Ask how this skill could help a customer, classmate, school, church, office, entrepreneur or community organization. A useful skill becomes more valuable when it solves a real problem.')}`);page('',`<div class="kicker">Chapter ${ci+1} · Worked Example</div><h1>Worked Example & Decision Process</h1>${para('Scenario: A learner receives a task in this subject area but the request is vague. Instead of starting immediately, the learner converts it into a clear problem statement.')}<div class="box"><h3>1. Clarify</h3>${para('What is the desired result? Who will use it? What constraints exist? What does success look like?')}</div><div class="box"><h3>2. Inspect</h3>${para('Collect the current facts, tools, data, settings or requirements before changing anything.')}</div><div class="box"><h3>3. Plan</h3>${para('Choose the smallest safe action that can test the main assumption.')}</div><div class="box"><h3>4. Verify</h3>${para('Compare the result with the success criteria and keep evidence.')}</div><div class="box"><h3>5. Document</h3>${para('Write the final steps clearly enough that another person can repeat them.')}</div>`);page('',`<div class="kicker">Chapter ${ci+1} · Troubleshooting</div><h1>Common Problems & Troubleshooting</h1>${bullets(['Problem statement is too broad — rewrite it as one measurable outcome.','Too many changes were made at once — return to a known state and test one variable at a time.','Result cannot be reproduced — record exact settings, data, versions and steps.','A tool gives an unexpected result — verify input, permissions, connectivity and assumptions.','A solution works temporarily — investigate root cause rather than treating only symptoms.','The learner is stuck — explain the problem aloud, draw the workflow, or ask a precise question.'])}<h2>Diagnostic pattern</h2><div class="callout"><b>Observe → Isolate → Test → Compare → Correct → Verify → Document</b></div>`);page('',`<div class="kicker">Chapter ${ci+1} · Exercise</div><h1>Practical Exercise / Mini Project</h1>${para('Create a small deliverable that demonstrates the chapter skill. The deliverable should be understandable to someone who did not watch you build it.')}<h2>Required evidence</h2>${bullets(['Title and problem statement','Tools or resources used','Step-by-step method','Screenshot, sample, table, diagram or other evidence','Result and verification','One mistake encountered and how it was corrected','One improvement you would make in a second version'])}<h2>Reflection</h2>${bullets(['What did I understand better after doing the work?','Which step required the most reasoning?','How could this be useful in a real M-TECH service or community project?'])}`);page('',`<div class="kicker">Chapter ${ci+1} · Review</div><h1>Review Questions & Key Terms</h1><ol><li>Explain the chapter topic in your own words.</li><li>List three important concepts from the lesson notes.</li><li>Describe one practical use of this skill.</li><li>What evidence would prove that your solution worked?</li><li>Give one common failure and a logical troubleshooting approach.</li><li>How could this skill support a business, school or community?</li><li>What safety, ethical or data-protection consideration applies?</li><li>Design a small project that uses this chapter.</li></ol><h2>Key terms</h2>${para((p.category||'Technology')+' · requirements · verification · troubleshooting · documentation · workflow · evidence · improvement')}`)});
page('',`<div class="kicker">Innovation Lab</div><h1>Innovation Lab Framework</h1>${para('Innovation begins with a real need, not merely a technology. Use this framework to move from an observation to a tested solution.')} ${bullets(['Idea or observed problem','Problem definition','Users and beneficiaries','Research and existing alternatives','Requirements and constraints','Proposed solution','Prototype','Testing and feedback','Cost and resources','Implementation plan','Results and lessons','Knowledge Bank or M-TECH service handoff'])}<div class="callout"><b>Innovation rule:</b> A prototype is a question made visible. Test it to learn, not merely to impress.</div>`);page('',`<div class="kicker">Project Workbook</div><h1>Project Workbook</h1><h2>Project title</h2><p>____________________________________________________________</p><h2>Problem statement</h2><p>____________________________________________________________</p><h2>Target users</h2><p>____________________________________________________________</p><h2>Success criteria</h2><p>____________________________________________________________</p><h2>Tasks, owners and deadlines</h2><p>____________________________________________________________</p><h2>Testing evidence</h2><p>____________________________________________________________</p><h2>Final result and lessons</h2><p>____________________________________________________________</p>`);page('',`<div class="kicker">Assessment</div><h1>Skills Assessment & Rubric</h1><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="text-align:left;border-bottom:2px solid #222">Area</th><th>Beginning</th><th>Developing</th><th>Competent</th><th>Strong</th></tr>${['Understanding','Practical execution','Troubleshooting','Documentation','Safety & ethics','Communication','Innovation'].map(x=>`<tr><td style="padding:10px 4px;border-bottom:1px solid #ddd"><b>${x}</b></td><td>1</td><td>2</td><td>3</td><td>4</td></tr>`).join('')}</table><h2>Portfolio evidence</h2>${para('Keep projects, screenshots, reports, prototypes, spreadsheets, diagrams, code samples and verified solutions as evidence of what you can actually do.')}`);page('',`<div class="kicker">Toolkit</div><h1>M-TECH Problem-Solving Toolkit</h1>${bullets(['Five Whys — repeatedly ask why until the underlying cause becomes clearer.','Problem statement — define current state, desired state and measurable gap.','Checklist — protect repeatable work from skipped steps.','Decision table — compare options against cost, risk, time and benefit.','Test log — record action, expected result, actual result and next decision.','Before/after evidence — prove improvement.','Knowledge Bank — preserve verified solutions for future reuse.','Escalation rule — know when a problem needs a more experienced person or professional service.'])}`);page('',`<div class="kicker">Glossary</div><h1>Selected Glossary</h1>${['Algorithm — a defined sequence for solving a task.','Backup — a separate recoverable copy of data.','Database — structured data organized for reliable storage and retrieval.','ERP — integrated system connecting major business processes.','Firewall — control that filters network traffic according to rules.','LAN — local area network connecting nearby devices.','Prototype — early model used to test an idea.','Requirement — a condition a solution must satisfy.','Risk — possibility of an event causing loss or harm.','Root cause — underlying reason a problem occurs.','Validation — checking whether a solution meets the intended need.','Verification — checking whether work was performed correctly.'].map(x=>`<p><b>${esc(x.split(' — ')[0])}</b> — ${esc(x.split(' — ')[1])}</p>`).join('')}`);page('',`<div class="kicker">Review Guidance</div><h1>Review & Answer Guidance</h1>${para('Strong answers explain reasoning, not only final results. When reviewing your work, look for evidence that the learner understands the concept, can apply it, can diagnose failure and can communicate the method clearly.')}<h2>Self-check</h2>${bullets(['Can I explain this without reading the book?','Can I perform a simple example?','Can I identify a likely cause when it fails?','Can I verify the result objectively?','Can another person follow my documentation?','Do I understand the safety and ethical boundaries?'])}`);page('',`<div class="kicker">Action Plan</div><h1>Personal Learning & Innovation Action Plan</h1><h2>Skills I want to strengthen</h2><p>____________________________________________________________</p><h2>Three projects I will complete</h2><p>1. __________________________________________________________</p><p>2. __________________________________________________________</p><p>3. __________________________________________________________</p><h2>People I can collaborate with</h2><p>____________________________________________________________</p><h2>How I will measure progress</h2><p>____________________________________________________________</p>`);page('',`<div class="kicker">Closing</div><h1>Keep Learning. Keep Solving. Keep Building.</h1>${para('The purpose of this handbook is not to make the learner dependent on notes. It is to create a disciplined habit of understanding problems, testing ideas, documenting evidence and building solutions that other people can use.')}<div class="callout"><h2 style="margin-top:0">M-TECH Problem Solving & Innovation Hub</h2><p>Bring a problem. Understand it. Collaborate. Build a solution. Learn from the result.</p></div><h2>Contact M-TECH</h2>${para('Mulbah Technology Solution Liberia Ltd. · Monrovia, Liberia · 0773330241 / 0772741860 / 0555387355')}<p style="text-align:center;margin-top:55px;font-size:20px"><b>WITH GOD WE BUILD SOLUTIONS</b></p>`);book.innerHTML=pages.join('');if(PAGE!==70)console.warn('Expected 70 pages, generated',PAGE)}
