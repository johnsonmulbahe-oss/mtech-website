<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1120"><title>M-TECH Customer Portal</title><link rel="icon" href="../icon-192.png"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top right,#38217755,transparent 35%),#080b13;color:#fff}.wrap{max-width:900px;margin:auto;padding:20px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:70px;height:70px;object-fit:contain}.card{background:rgba(17,24,43,.92);border:1px solid #2d3958;border-radius:20px;padding:18px;margin:14px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;border:1px solid #3b4a70;background:#17233d}.btn{display:inline-block;border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(135deg,#18d5ce,#4c8fff 48%,#642dd8);color:#fff;text-decoration:none;font-weight:800}.btn.alt{background:#151c30;border:1px solid #34405f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#aab4d1}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand"><img src="../mtech-logo.png"><div><h1 style="margin:0">M-TECH Customer Portal</h1><div class="muted">Track your request, quotation, job and invoice</div></div></div><div id="content" class="card">Loading your service record…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','sb_publishable_vQULGJJZNtuT_MZCSqomiQ_URYS4BQp');const q=new URLSearchParams(location.search),token=q.get('token'),c=document.getElementById('content'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=(v,cur)=>`${cur} ${Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;async function load(){if(!token){c.innerHTML='<h2>Missing tracking code</h2><p>Please open the customer portal from the link given after submitting your request.</p>';return}const {data,error}=await SB.rpc('get_customer_portal',{p_tracking_token:token});if(error||!data){c.innerHTML='<h2>Unable to find request</h2><p>'+esc(error?.message||'The tracking link is invalid.')+'</p>';return}const d=data,r=d.request,quotes=d.quotations||[],jobs=d.jobs||[],invoices=d.invoices||[];c.innerHTML=`<h2>Welcome ${esc(d.customer?.full_name||'Customer')}</h2><div class="card"><b>${esc(r.request_no)}</b> <span class="pill">${esc(r.status)}</span><p><b>${esc(r.category_name)}</b><br>${esc(r.problem_summary)}</p><p class="muted">${esc(r.description||'')}</p></div><div class="grid"><div class="card"><h3>Quotations</h3>${quotes.map(x=>`<div><b>${esc(x.quotation_no)}</b> · ${money(x.total,x.currency)}<br><span class="pill">${esc(x.status)}</span><div class="actions" style="margin-top:8px"><a class="btn alt" href="document.html?type=quote&token=${x.public_token}">Open Quotation</a></div></div>`).join('<hr>')||'<p class="muted">No quotation yet.</p>'}</div><div class="card"><h3>Jobs</h3>${jobs.map(x=>`<div><b>${esc(x.job_no)}</b> <span class="pill">${esc(x.status)}</span><p class="muted">Scheduled: ${x.scheduled_at?new Date(x.scheduled_at).toLocaleString():'Not scheduled'}<br>Warranty: ${esc(x.warranty_until||'—')}</p>${x.status==='completed'?`<div class="actions"><button class="btn" onclick="confirmJob('${esc(x.job_no)}',true)">Confirm Completed</button><button class="btn alt" onclick="confirmJob('${esc(x.job_no)}',false)">Report Issue</button></div>`:''}</div>`).join('<hr>')||'<p class="muted">No job yet.</p>'}</div></div><div class="card"><h3>Invoices</h3>${invoices.map(x=>`<div><b>${esc(x.invoice_no)}</b> · ${money(x.total,x.currency)}<br>Paid ${money(x.paid,x.currency)} · Balance ${money(x.balance,x.currency)} <span class="pill">${esc(x.status)}</span><div class="actions" style="margin-top:8px"><a class="btn alt" href="document.html?type=invoice&token=${x.public_token}">Open Invoice</a></div></div>`).join('<hr>')||'<p class="muted">No invoice yet.</p>'}</div><div class="card"><h3>Need help?</h3><div class="actions"><a class="btn" href="https://wa.me/231773330241">WhatsApp M-TECH</a><a class="btn alt" href="tel:0773330241">Call M-TECH</a></div></div>`}window.confirmJob=async(job,ok)=>{const note=prompt(ok?'Optional note:':'Tell us what still needs attention:')||'';const {error}=await SB.rpc('customer_job_completion_secure',{p_tracking_token:token,p_job_no:job,p_confirm:ok,p_note:note||null});if(error)return alert(error.message);alert(ok?'Thank you. Completion confirmed.':'Thank you. M-TECH has recorded your concern.');load()};load();</script></body></html>
