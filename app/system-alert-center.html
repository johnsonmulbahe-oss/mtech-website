<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>M-TECH System Alerts</title><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-192.png"><link rel="stylesheet" href="brand-ios26.css"><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#05070d;color:#fff}.shell{max-width:1000px;margin:auto;padding:18px}.hero,.card{border:1px solid rgba(255,255,255,.13);background:rgba(12,19,35,.84);border-radius:22px}.hero{display:flex;gap:15px;align-items:center;padding:18px}.hero img{width:76px;height:76px;object-fit:contain}.hero h1{margin:0}.muted{color:#aab4d1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.07);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#35e5df,#4387ff 55%,#7139e9)}.card{padding:15px;margin:10px 0}.critical{border-color:#ff6b6b}.warning{border-color:#f0c35a}.ok{border-color:#55d98b}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tag{font-size:11px;font-weight:900;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.08)}.empty{text-align:center;padding:35px;color:#aab4d1}.copyright{text-align:center;color:#7f8aaa;font-size:12px;padding:24px}</style></head><body><div class="shell"><section class="hero"><img src="../mtech-logo.png"><div><div style="font-weight:900;letter-spacing:.12em;font-size:11px">WITH GOD WE BUILD SOLUTIONS</div><h1>CEO System Integrity & Alert Center</h1><div class="muted">Serious application, connectivity, authentication, database, PWA and synchronization warnings detected on this device.</div></div></section><div class="toolbar"><a class="btn" href="management.html">Back to Management</a><button class="btn primary" id="notify">Enable Browser Alerts</button><button class="btn" id="refresh">Refresh</button><button class="btn" id="resolve">Mark All Resolved</button></div><div id="status" class="card ok">Checking CEO access…</div><div id="list"></div><div class="copyright">© <span id="year"></span> Mulbah Technology Solutions Liberia Ltd. (M-TECH). All rights reserved.</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const STORE='mtech-system-integrity-alerts-v35';const SB=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','sb_publishable_vQULGJJZNtuT_MZCSqomiQ_URYS4BQp',{auth:{persistSession:true,autoRefreshToken:true}});const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));document.getElementById('year').textContent=new Date().getFullYear();function read(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}function save(v){localStorage.setItem(STORE,JSON.stringify(v))}function render(){const a=read(),open=a.filter(x=>!x.resolved);document.getElementById('status').textContent=open.length?`${open.length} unresolved system alert(s) on this device.`:'No unresolved local system alerts detected.';document.getElementById('status').className='card '+(open.length?'warning':'ok');document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="card ${esc(x.severity)}"><div class="row"><div><span class="tag">${esc(x.severity)}</span> <b>${esc(x.title)}</b><div class="muted" style="margin-top:6px">${new Date(x.at).toLocaleString()} · ${esc(x.source)}</div></div><div>${x.resolved?'Resolved':'Open'}</div></div><p>${esc(x.detail)}</p></div>`).join(''):'<div class="empty">No alerts recorded yet.</div>'}async function guard(){const {data:{session}}=await SB.auth.getSession();if(!session){document.getElementById('status').textContent='CEO sign-in required.';return}const {data:p}=await SB.from('profiles').select('role,active').eq('id',session.user.id).maybeSingle();if(!p||String(p.role).toLowerCase()!=='ceo'||p.active===false){document.body.innerHTML='<div class="shell"><div class="card critical"><h2>CEO access only</h2><a class="btn" href="management.html">Return</a></div></div>';return}render()}document.getElementById('notify').onclick=async()=>{if(!('Notification'in window))return alert('Browser notifications are not supported on this device/browser.');const p=await Notification.requestPermission();alert('Notification permission: '+p)};document.getElementById('refresh').onclick=render;document.getElementById('resolve').onclick=()=>{const a=read().map(x=>({...x,resolved:true}));save(a);render()};guard();</script></body></html>
