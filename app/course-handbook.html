['Understanding Computers',['computer systems','input, processing, output and storage','hardware versus software','data and information','common computing environments'],'Inspect three devices and identify their input, processing, output and storage components.'],['Computer Hardware',['system unit','motherboard and CPU','RAM','storage devices','ports and peripherals'],'Open or examine a desktop/laptop safely and identify major components without removing parts unnecessarily.'],['Operating Systems',['Windows concepts','files and folders','user accounts','updates','basic system settings'],'Create a logical folder structure for school or business documents and practice safe file management.'],['Applications & Productivity',['word processing','spreadsheets','presentations','browsers','cloud tools'],'Prepare a short business memo, a simple spreadsheet and a five-slide presentation.'],['Files, Storage & Backup',['file types','local storage','external storage','cloud storage','backup strategy'],'Build a 3-2-1 backup plan for important M-TECH or personal documents.'],['Internet & Web Basics',['internet versus web','browsers','URLs','search skills','downloads and uploads'],'Compare search results for one technical question and document how you judged source quality.'],['Email & Online Communication',['email structure','attachments','professional messages','spam','collaboration'],'Write a professional service email with a clear subject, attachment and closing.'],['Digital Safety',['passwords','MFA','malware','phishing','device updates'],'Review a sample phishing message and list at least five warning signs.'],['Troubleshooting Basics',['symptom collection','restart and isolation','hardware checks','software checks','documentation'],'Use a structured checklist to troubleshoot a slow computer.'],['Mobile & Cross-Device Skills',['Android and iPhone basics','app permissions','storage','sync','hotspots'],'Configure safe permissions and cloud sync on a mobile device.'],['Maintenance & Performance',['updates','disk space','startup apps','cleaning','battery care'],'Perform a documented monthly computer maintenance routine.'],['Capstone: Digital Workstation',['requirements','setup','security','backup','user training'],'Design a complete workstation setup for a student, small business or M-TECH technician.']]},
'excel-data-skills':{title:'Excel & Data Skills',subtitle:'Formulas, Data Management, Dashboards & Business Reporting',level:'Beginner to Advanced',chapters:[['Excel Foundations',['workbooks and worksheets','cells and ranges','data types','formatting','navigation'],'Create a clean workbook with named sheets and consistent formatting.'],['Data Entry & Validation',['structured data','tables','validation lists','error prevention','data cleaning'],'Build a validated customer or inventory entry sheet.'],['Essential Formulas',['SUM','AVERAGE','MIN/MAX','COUNT','relative and absolute references'],'Create a sales summary using core formulas and absolute references.'],['Logical & Conditional Formulas',['IF','IFS','AND/OR','SUMIF/SUMIFS','COUNTIF/COUNTIFS'],'Build commission or status calculations using conditional logic.'],['Lookup Functions',['XLOOKUP','VLOOKUP concepts','INDEX/MATCH concepts','reference tables','error handling'],'Create a product-price lookup and return a friendly message when an item is missing.'],['Dates, Text & Cleaning',['date functions','text functions','TRIM/CLEAN','concatenation','data normalization'],'Clean a messy contact list and standardize names and dates.'],['Charts & Visualization',['chart selection','labels','scales','trend communication','dashboard layout'],'Build a simple monthly sales dashboard with appropriate charts.'],['Pivot Tables',['summarization','grouping','filters','slicers','pivot charts'],'Create a pivot report by service, month and employee.'],['Business Models',['pricing','commission','inventory movement','cash tracking','budgeting'],'Design a small business daily operations model.'],['Protection & Auditability',['sheet protection','locked formulas','data checks','versioning','documentation'],'Protect formula cells while leaving authorized input cells editable.'],['Automation Concepts',['structured tables','named ranges','Power Query concepts','macros concepts','repeatable workflows'],'Map a repetitive reporting task and design an automation approach.'],['Capstone: Management Workbook',['requirements','database design','dashboard','controls','print reports'],'Design an end-to-end Excel management system for a small business.']]},
'networking-starlink':{title:'Networking & Starlink',subtitle:'LAN, Wi-Fi, Internet, Starlink Installation & Troubleshooting',level:'Beginner to Advanced',chapters:[['Networking Foundations',['LAN/WAN','clients and servers','packets','bandwidth and latency','network topologies'],'Draw a simple home or office network map.'],['IP Addressing Basics',['IPv4','subnets concepts','DHCP','static addressing','default gateway'],'Identify the IP, gateway and DNS settings on a device.'],['Network Devices',['routers','switches','access points','modems','firewalls'],'Match devices to roles in a small office network.'],['Ethernet & Cabling',['UTP categories','RJ45','termination concepts','cable testing','PoE'],'Plan a safe cable route and label each endpoint.'],['Wi-Fi Design',['2.4/5 GHz','channels','coverage','interference','SSID security'],'Perform a simple Wi-Fi coverage survey and recommend access point placement.'],['Internet Services',['ISP concepts','throughput','latency','DNS','public/private IP'],'Compare speed-test results and explain what each measurement means.'],['Starlink Fundamentals',['kit components','dish visibility','obstructions','router','service plans'],'Use the obstruction concept to choose a suitable installation location.'],['Starlink Installation',['site survey','mounting','cable routing','power','activation and testing'],'Prepare a professional installation checklist before going on-site.'],['Network Security',['WPA2/WPA3','guest networks','firewall','updates','password policy'],'Harden a small office wireless network.'],['Troubleshooting Connectivity',['layered diagnosis','physical checks','IP tests','DNS tests','speed issues'],'Troubleshoot a device that connects to Wi-Fi but cannot browse.'],['Business Network Design',['requirements','capacity','segmentation','backup internet','documentation'],'Design a network for a school, pharmacy or office.'],['Capstone: Starlink + LAN Deployment',['consultation','plan','install','test','handover and support'],'Produce a complete deployment plan and customer handover checklist.']]},
'website-development':{title:'Website Development',subtitle:'Design, Front-End Development, Deployment & Maintenance',level:'Beginner to Advanced',chapters:[['How the Web Works',['clients and servers','HTTP/HTTPS','domains','hosting','DNS'],'Trace what happens after entering a website address in a browser.'],['HTML Foundations',['document structure','headings','paragraphs','links','forms and semantics'],'Build a semantic one-page company profile.'],['CSS Foundations',['selectors','box model','typography','spacing','responsive design'],'Style the company profile for mobile and desktop.'],['Layout Systems',['Flexbox','Grid','containers','breakpoints','component thinking'],'Create a responsive service-card layout.'],['JavaScript Basics',['variables','functions','events','DOM','form validation'],'Add interactive validation to a contact form.'],['UX & Accessibility',['user journeys','navigation','contrast','labels','keyboard and screen-reader basics'],'Audit a page for usability and accessibility improvements.'],['Forms & Data',['form design','validation','submission','security basics','success states'],'Design a fast customer service-request form.'],['Performance',['image optimization','caching','minification concepts','lazy loading','Core Web Vitals concepts'],'Reduce the weight of a sample page and measure improvements.'],['SEO Foundations',['titles','meta descriptions','headings','content quality','structured navigation'],'Prepare an SEO checklist for a small business website.'],['Deployment',['GitHub Pages','cloud hosting concepts','domains','HTTPS','environment configuration'],'Deploy a static site and test it on multiple devices.'],['Maintenance & Security',['updates','backups','monitoring','forms abuse','change management'],'Create a monthly website maintenance plan.'],['Capstone: Business Website',['requirements','wireframe','build','test','launch and support'],'Plan and build a complete small-business website project.']]},
'database-erp':{title:'Database & ERP',subtitle:'Relational Databases, Microsoft Access Concepts & Business Systems',level:'Intermediate',chapters:[['Database Thinking',['data versus information','entities','attributes','records','business rules'],'Identify entities and attributes for a service company.'],['Relational Design',['tables','primary keys','foreign keys','relationships','normalization'],'Normalize a simple customer-order spreadsheet into related tables.'],['Data Types & Constraints',['text','numbers','dates','required fields','validation'],'Choose suitable data types for a staff and customer database.'],['Queries',['filtering','sorting','joins','aggregates','parameter queries'],'Design queries for unpaid invoices and monthly sales.'],['Forms & User Entry',['form layout','validation','lookup fields','workflow','user friendliness'],'Sketch a simple data-entry form for ordinary users.'],['Reports',['grouping','totals','print design','filters','audit information'],'Design a printable management report.'],['Access Concepts',['tables','queries','forms','reports','macros concepts'],'Map an Access application architecture for a small office.'],['ERP Fundamentals',['integrated modules','master data','transactions','workflows','controls'],'Explain how Sales, Inventory and Finance exchange data in an ERP.'],['Accounting Integration',['chart of accounts','receivables','payables','inventory','audit trail'],'Trace one sale from invoice through payment and ledger impact.'],['Security & Roles',['least privilege','role-based access','approval','audit logs','backups'],'Create a permission matrix for CEO, manager and ordinary user.'],['Implementation & Migration',['requirements','data cleaning','testing','training','go-live'],'Prepare a phased ERP implementation checklist.'],['Capstone: Business ERP Blueprint',['scope','modules','database','permissions','reports and deployment'],'Produce a blueprint for an integrated ERP for a growing company.']]},
'cybersecurity-foundations':{title:'Cybersecurity Foundations',subtitle:'Defensive Security, Ethical Assessment & Safe Computing',level:'Intermediate',chapters:[['Security Principles',['confidentiality','integrity','availability','risk','defense in depth'],'Classify risks to a small business and prioritize them.'],['Threats & Vulnerabilities',['malware','phishing','weak passwords','misconfiguration','social engineering'],'Review common attack paths and identify defensive controls.'],['Identity & Access',['authentication','MFA','password managers','least privilege','account lifecycle'],'Design a strong account-access policy.'],['Endpoint Security',['updates','antimalware','device encryption','firewalls','backups'],'Create a workstation hardening checklist.'],['Network Security',['segmentation','Wi-Fi security','firewalls','VPN concepts','monitoring'],'Design a secure guest and staff Wi-Fi arrangement.'],['Web Security Awareness',['HTTPS','input validation concepts','sessions','updates','safe hosting'],'Conduct a defensive website security review without exploitation.'],['Data Protection',['classification','encryption concepts','backup','retention','secure disposal'],'Classify business information and define handling rules.'],['Email & Social Engineering Defense',['phishing indicators','verification','business email compromise','training','reporting'],'Create a phishing response procedure.'],['Ethical Security Assessment',['authorization','scope','rules of engagement','evidence','reporting'],'Draft a safe assessment scope and authorization checklist.'],['Incident Response',['prepare','identify','contain','recover','lessons learned'],'Run a tabletop exercise for a compromised email account.'],['Security Governance',['policies','risk register','vendor risk','awareness','continuous improvement'],'Create a basic cybersecurity policy set for a small company.'],['Capstone: Security Improvement Plan',['assessment','priorities','controls','timeline','verification'],'Produce a 90-day defensive security improvement plan.']]},
'ai-problem-solving':{title:'AI & Problem Solving',subtitle:'Responsible AI, Structured Reasoning & Solution Development',level:'All Levels',chapters:[['Problem Definition',['symptoms versus causes','scope','stakeholders','constraints','success criteria'],'Rewrite a vague problem into a measurable problem statement.'],['Evidence & Research',['facts','assumptions','sources','data quality','verification'],'Build an evidence table separating known facts from assumptions.'],['Root Cause Analysis',['5 Whys','fishbone concepts','process mapping','cause versus correlation','validation'],'Perform a root-cause analysis on a recurring service problem.'],['Generating Options',['brainstorming','constraints','alternatives','trade-offs','creativity'],'Generate at least five solution options before choosing one.'],['Decision Making',['criteria','weighting','cost','risk','impact'],'Use a simple decision matrix to compare alternatives.'],['AI Fundamentals',['models','prompts','context','limitations','hallucinations'],'Compare two prompts and identify why one produces a clearer result.'],['Responsible AI Use',['privacy','bias','verification','academic integrity','human oversight'],'Create an AI-use checklist for school and business work.'],['AI for Learning',['explanations','quizzes','summaries','study plans','feedback'],'Turn a lesson into a study guide and self-test.'],['AI for Business',['drafting','analysis','customer support','automation concepts','decision support'],'Design an AI-assisted workflow with human approval points.'],['Prototyping Solutions',['minimum viable solution','testing','feedback','iteration','documentation'],'Create and test a simple prototype for a real problem.'],['Communicating Solutions',['problem story','evidence','recommendation','implementation','results'],'Prepare a five-minute solution presentation.'],['Capstone: Problem-to-Solution Project',['problem','research','options','prototype','evaluation and lessons'],'Complete a structured real-world problem-solving project.']]},
'entrepreneurship-innovation':{title:'Entrepreneurship & Innovation',subtitle:'Ideas, Business Models, Validation, Finance & Growth',level:'All Levels',chapters:[['Entrepreneurial Mindset',['problems as opportunities','initiative','learning','resilience','ethics'],'List five local problems that could become responsible business opportunities.'],['Customer Problems',['customer segments','pain points','jobs to be done','interviews','evidence'],'Interview potential users and record recurring needs.'],['Value Proposition',['benefits','differentiation','outcomes','positioning','proof'],'Write a clear value proposition for one idea.'],['Business Models',['customers','channels','revenue','costs','partners'],'Sketch a simple business model canvas.'],['Market Research',['market size concepts','competitors','pricing','trends','validation'],'Compare three competitors or alternatives.'],['Prototyping & MVP',['minimum viable product','service prototype','testing','feedback','iteration'],'Build the smallest testable version of an idea.'],['Pricing & Unit Economics',['costs','margin','break-even','cash flow','pricing strategy'],'Estimate direct cost, selling price and contribution margin.'],['Marketing & Sales',['branding','channels','sales funnel','trust','customer service'],'Create a simple customer-acquisition plan.'],['Operations',['processes','quality','suppliers','inventory','service delivery'],'Map the steps required to deliver a product or service consistently.'],['Finance & Records',['budget','cash book','profit','receivables','basic reporting'],'Create a simple monthly budget and cash-flow forecast.'],['Growth & Risk',['capacity','people','systems','partnerships','risk management'],'Identify the controls needed before scaling.'],['Capstone: Innovation Venture',['problem','solution','business model','prototype','pitch and implementation plan'],'Prepare a complete innovation pitch and 90-day action plan.']]}
};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pageShell(inner,n,course,cls=''){return `<section class="page ${cls}"><div class="watermark"><img src="${LOGO}"></div><div class="owner">Owned by M-TECH Solution Liberia Ltd.</div>${inner}<div class="footer"><span>M-TECH · With God We Build Solutions</span><span>${esc(course.title)} · Page ${n}</span></div></section>`}
function prose(topic,concepts){return `<p><b>${esc(topic)}</b> is best learned by connecting definitions to real tasks. In this handbook, the learner should first understand the purpose of the concept, then identify where it appears in a real computer, network, business, project or organization. Good technical work is not only about remembering terms; it is about observing accurately, following a repeatable process, documenting what was done, checking the result and knowing when to ask for higher-level support.</p><p>The key ideas in this section are <b>${concepts.map(esc).join(', ')}</b>. Study each idea as part of one system rather than as isolated vocabulary. Ask what problem it solves, what inputs it requires, what output should be expected, what can go wrong and what evidence proves that the task was completed correctly.</p>`}
function build(){const slug=new URLSearchParams(location.search).get('course')||'computer-fundamentals',c=BOOKS[slug]||BOOKS['computer-fundamentals'];document.title='M-TECH — '+c.title+' Handbook';let pages=[],n=1;pages.push(pageShell(`<img class="logo" src="${LOGO}"><span class="badge">M-TECH PROFESSIONAL LEARNING SERIES</span><h1>${esc(c.title)}</h1><h2>${esc(c.subtitle)}</h2><div class="meta"><b>Comprehensive Course Handbook</b><br>Level: ${esc(c.level)}<br>Designed for students, technicians, entrepreneurs and lifelong learners.<br><br><b>Mulbah Technology Solution Liberia Ltd.</b><br>WITH GOD WE BUILD SOLUTIONS</div>`,n++,c,'cover'));pages.push(pageShell(`<h1>Ownership, Copyright & Responsible Use</h1><div class="callout"><b>Owned by M-TECH Solution Liberia Ltd.</b></div><p>This handbook is an M-TECH educational publication prepared for learning, training, problem solving and professional development. The M-TECH brand, structure and original instructional material should be preserved when the handbook is shared or printed.</p><p>Learners may use the material for personal study, classroom discussion, internal training and supervised practical exercises. Technical activities must be performed legally, safely and only on equipment, systems or accounts for which the learner has permission.</p><h2>About M-TECH</h2><p>Mulbah Technology Solution Liberia Ltd. provides technology solutions, training and practical problem solving. Our learning approach connects theory with real tasks so that knowledge can be applied responsibly in schools, businesses, communities and professional environments.</p><h2>Motto</h2><p><b>With God We Build Solutions.</b></p>`,n++,c));pages.push(pageShell(`<h1>How to Use This Handbook</h1><p>This book is arranged as a practical course. Each chapter contains learning objectives, core explanations, worked examples, practical activities and review questions. Do not rush through the pages. Read, practice, document and review.</p><ol><li>Read the chapter objectives.</li><li>Study the concepts and key terms.</li><li>Follow the worked example.</li><li>Complete the practical activity.</li><li>Answer the review questions without looking back first.</li><li>Record problems, observations and lessons learned.</li></ol><div class="exercise"><b>Learning record:</b> Keep a notebook or digital journal containing dates, exercises completed, screenshots/photos where appropriate, problems encountered and how you solved them.</div><h2>Assessment</h2><p>A suggested course assessment is 30% exercises, 20% quizzes/review questions, 20% practical demonstrations and 30% final capstone project.</p>`,n++,c));pages.push(pageShell(`<h1>Table of Contents</h1><ol class="toc">${c.chapters.map((x,i)=>`<li><b>Chapter ${i+1}:</b> ${esc(x[0])}</li>`).join('')}<li>Final Assessment & Capstone Guidance</li><li>Glossary & Continuing Learning</li></ol><h2>Course Outcomes</h2><p>By the end of this handbook, a serious learner should be able to explain the major concepts, perform guided practical work, troubleshoot common problems using a structured method, document work clearly and complete a capstone project demonstrating applied understanding.</p>`,n++,c));for(let i=0;i<c.chapters.length;i++){const [title,concepts,lab]=c.chapters[i];const ch=i+1;pages.push(pageShell(`<span class="badge">CHAPTER ${ch}</span><h1>${esc(title)}</h1><h2>Learning Objectives</h2><ul>${concepts.map(x=>`<li>Explain and apply ${esc(x)}.</li>`).join('')}</ul><div class="callout"><b>Chapter purpose:</b> Build usable understanding, not only memorized definitions.</div>${prose(title,concepts)}`,n++,c));pages.push(pageShell(`<h1>${esc(title)} — Core Concepts</h1>${prose(title,concepts)}<h2>Key Concepts</h2><div class="columns"><ul>${concepts.map(x=>`<li><b>${esc(x)}</b> — define it in your own words, identify an example, and state one common error or risk.</li>`).join('')}</ul></div><h2>Professional Practice</h2><p>A competent learner should be able to explain the concept to another person in simple language. If you cannot explain why a step is necessary, review the material before moving to the practical exercise.</p>`,n++,c));pages.push(pageShell(`<h1>${esc(title)} — Worked Example</h1><p>Consider a realistic M-TECH-style situation where a customer, student or organization needs help related to <b>${esc(title)}</b>. Begin by collecting the facts. Identify the user's goal, current condition, constraints and evidence. Avoid making changes before you understand the starting state.</p><ol><li><b>Observe:</b> Record what is happening now.</li><li><b>Define:</b> State the desired result.</li><li><b>Plan:</b> Choose a safe sequence of actions.</li><li><b>Execute:</b> Change one controlled thing at a time.</li><li><b>Verify:</b> Test the result using evidence.</li><li><b>Document:</b> Record settings, findings and next steps.</li></ol><div class="callout"><b>Concepts used:</b> ${concepts.map(esc).join(' · ')}</div><p>This method prevents random troubleshooting and helps another technician or learner reproduce the result.</p>`,n++,c));pages.push(pageShell(`<h1>${esc(title)} — Practical Activity</h1><div class="exercise"><h2>Hands-on Task</h2><p>${esc(lab)}</p><h3>Before you begin</h3><ul><li>Confirm that you have permission to perform the activity.</li><li>Protect important data and settings.</li><li>Write down the expected result.</li></ul><h3>Evidence to collect</h3><ul><li>Starting condition.</li><li>Steps performed.</li><li>Result of each important test.</li><li>Final condition and any remaining problem.</li></ul></div><h2>Reflection</h2><p>What worked? What did not work? What assumption did you make? What would you change if you repeated the task for a customer or classmate?</p>`,n++,c));pages.push(pageShell(`<h1>${esc(title)} — Review & Troubleshooting</h1><h2>Review Questions</h2><ol><li>Define ${esc(concepts[0])} in your own words.</li><li>How is ${esc(concepts[1]||concepts[0])} used in practice?</li><li>What could go wrong if ${esc(concepts[2]||concepts[0])} is configured or understood incorrectly?</li><li>What evidence would prove that the task was successful?</li><li>How would you explain this chapter to a beginner?</li></ol><h2>Troubleshooting Checklist</h2><ul><li>Confirm the symptom before changing anything.</li><li>Check simple and physical causes first where applicable.</li><li>Compare current settings with known-good settings.</li><li>Change one variable at a time.</li><li>Retest after each meaningful change.</li><li>Document the final solution.</li></ul><div class="callout"><b>Chapter completion:</b> Do not mark this chapter complete until you can answer the questions and demonstrate the practical task.</div>`,n++,c));}pages.push(pageShell(`<h1>Final Assessment & Capstone Guidance</h1><h2>Capstone Requirement</h2><p>Complete a project that combines several chapters. The project should solve a real or realistic problem and should include a problem statement, requirements, plan, implementation, testing, evidence, reflection and final recommendation.</p><h2>Suggested Marking</h2><ul><li>Problem definition and requirements — 15%</li><li>Technical understanding — 20%</li><li>Practical implementation — 25%</li><li>Testing and evidence — 15%</li><li>Documentation and presentation — 15%</li><li>Professionalism, safety and ethics — 10%</li></ul><div class="exercise"><b>Presentation:</b> Prepare a short demonstration explaining the problem, your approach, the result and what you learned.</div>`,n++,c));pages.push(pageShell(`<h1>Glossary & Continuing Learning</h1><p>Build your own glossary while studying. Add every unfamiliar term, a simple definition, an example and the chapter where you encountered it.</p><h2>Continuing Learning Plan</h2><ol><li>Choose one skill from the book to practice weekly.</li><li>Complete a small real-world project.</li><li>Join the M-TECH Problem Solving & Innovation Hub to discuss questions and solutions.</li><li>Teach one concept to another learner.</li><li>Keep evidence of your projects in a skills portfolio.</li></ol><div class="callout"><b>Remember:</b> Technology changes, but disciplined learning, testing, documentation, ethics and problem solving remain valuable.</div><h2>M-TECH</h2><p><b>Owned by M-TECH Solution Liberia Ltd.</b><br>With God We Build Solutions.<br>Technology is our passion, Education is our life.</p>`,n++,c));document.getElementById('book').innerHTML=pages.join('');window.__course=c;window.__pageCount=pages.length;}
function plainText(){const c=window.__course;let s=`M-TECH PROFESSIONAL LEARNING SERIES\n${c.title}\n${c.subtitle}\n\nOwned by M-TECH Solution Liberia Ltd.\nWITH GOD WE BUILD SOLUTIONS\n\n`;c.chapters.forEach((x,i)=>{s+=`CHAPTER ${i+1}: ${x[0]}\nKey concepts: ${x[1].join(', ')}\nPractical activity: ${x[2]}\n\n`;});return s+`Final Assessment, Glossary and Continuing Learning.\nEstimated print length: ${window.__pageCount} pages.\n`}
function dl(name,type,text){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function downloadBook(fmt){const c=window.__course,slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-'),html='<!doctype html>'+document.documentElement.outerHTML,txt=plainText();if(fmt==='html')dl('M-TECH-'+slug+'-handbook.html','text/html;charset=utf-8',html);if(fmt==='txt')dl('M-TECH-'+slug+'-handbook.txt','text/plain;charset=utf-8',txt);if(fmt==='md')dl('M-TECH-'+slug+'-handbook.md','text/markdown;charset=utf-8','# '+c.title+'\n\n'+txt);if(fmt==='doc')dl('M-TECH-'+slug+'-handbook.doc','application/msword','<html><head><meta charset="utf-8"></head><body>'+document.getElementById('book').innerHTML+'</body></html>')}
async function shareBook(){const c=window.__course;if(navigator.share){try{await navigator.share({title:'M-TECH '+c.title+' Handbook',text:'M-TECH professional course handbook — '+c.title,url:location.href})}catch(e){}}else navigator.clipboard?.writeText(location.href)}
build();
