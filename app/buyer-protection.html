rice change</option><option>Seller conduct</option><option>Poor service</option><option>Other</option></select></div><div class="field"><label>Describe what happened</label><textarea id="description"></textarea></div><div class="field"><label>Requested Resolution</label><textarea id="resolution" placeholder="Repair, replacement, refund, explanation, other..."></textarea></div><button class="btn" id="submit">Submit Buyer Protection Case</button><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InZzaXJlcGVqbGF5dGJxaGhpa2V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyOTI4MjQsImV4cCI6MjA3MTg2ODgyNH0.bH84qAKmvmoVwzheWMoxmlhAWdxVAy0GSJ5lvKGMyC0');const g=id=>document.getElementById(id);g('submit').onclick=async()=>{if(!g('name').value.trim()||!g('description').value.trim()){g('msg').textContent='Name and description are required.';return}g('msg').textContent='Submitting…';const payload={buyer_name:g('name').value.trim(),buyer_phone:g('phone').value.trim()||null,buyer_email:g('email').value.trim()||null,issue_type:g('type').value,description:g('description').value.trim(),requested_resolution:g('resolution').value.trim()||null};const ref=g('order').value.trim();if(ref&&/^[0-9a-f-]{36}$/i.test(ref))payload.order_id=ref;const {data,error}=await sb.from('buyer_protection_cases').insert(payload).select('case_code').single();g('msg').textContent=error?'Could not submit: '+error.message:'Submitted. Keep this reference: '+data.case_code}</script></body></html>
