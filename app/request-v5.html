<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11182f"><title>M-TECH Service Request</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#070911;color:#fff}header{padding:18px;background:#0d1324;border-bottom:1px solid #273250}.wrap{max-width:850px;margin:auto;padding:20px}.hero{padding:24px 0}.hero h1{font-size:clamp(34px,7vw,56px);margin:8px 0}.muted{color:#aeb8d5}.card{background:#11182b;border:1px solid #273250;border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:12px 0}input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #34405f;background:#090d18;color:#fff;font:inherit}textarea{min-height:100px}.btn{padding:13px 16px;border:0;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(135deg,#4c8fff,#642dd8)}.btn.secondary{background:#151b30;border:1px solid #34405f}.services{display:grid;grid-template-columns:1fr 1fr;gap:9px}.svc{padding:12px;text-align:left;border:1px solid #34405f;border-radius:11px;background:#0b1020;color:#fff}.svc.on{border-color:#48deda;background:#172444}.eyebrow{color:#48deda;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.success{color:#8ff0b6;font-weight:800}.error{color:#ffb4b4;font-weight:800}.media{border:1px dashed #3b4a70;border-radius:12px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:650px){.grid,.services{grid-template-columns:1fr}}</style></head><body><header><strong style="font-size:22px">M-TECH</strong><div class="muted">Mulbah Technology Solutions Liberia Ltd.</div></header><main class="wrap"><div class="hero"><div class="eyebrow">With God We Build Solutions</div><h1>Request Technology Service</h1><p class="muted">Choose the service, describe the problem, attach photos or audio if useful, and send directly to M-TECH.</p></div><section class="card"><h2>Customer Service Request</h2><div id="services" class="services"></div><div class="field"><label>Exact problem</label><select id="problem"></select></div><div class="field"><label>Written description</label><textarea id="description"></textarea></div><div class="field"><label>Photos (optional, up to 5)</label><div class="media"><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="photoInfo" class="muted"></div></div></div><div class="field"><label>Voice description (optional)</label><div class="media"><div class="row"><button type="button" class="btn secondary" id="recordBtn">🎤 Start Recording</button><button type="button" class="btn secondary" id="clearAudio" disabled>Remove Recording</button><span id="audioStatus" class="muted">No recording</span></div><audio id="audioPreview" controls style="display:none;width:100%;margin-top:10px"></audio></div></div><div class="grid"><div class="field"><label>Your name *</label><input id="customerName"></div><div class="field"><label>Phone / WhatsApp *</label><input id="customerPhone" inputmode="tel"></div></div><div class="grid"><div class="field"><label>Email</label><input id="customerEmail" type="email"></div><div class="field"><label>How should we assist?</label><select id="serviceMethod"><option>Visit Me / On-Site</option><option>Remote / Online</option><option>I will Bring the Device</option><option>Not Sure Yet</option></select></div></div><div class="field"><label>Area / Organization</label><input id="customerArea"></div><button type="button" class="btn" id="submitBtn" onclick="window.mtechSubmit()">Submit Request</button><p id="message" class="muted"></p></section></main><script>var API='https://vsirepejlaytbqhhikev.supabase.co/functions/v1/mtech-submit';var categories={'Computer Hardware':['Broken / Cracked Screen','Screen Not Displaying','Motherboard Issue','Keyboard Problem','Battery Problem','Not Charging','Other / Not Sure'],'Computer Software':['Windows Installation','Software Installation','Computer Running Slowly','Virus / Malware Removal','Data Recovery','Other / Not Sure'],'Networking & Internet':['Wi-Fi Not Working','Weak Wi-Fi Signal','Router Configuration','Network Cabling','Other / Not Sure'],'Starlink Services':['New Installation','Relocation','Poor Signal','Router Setup','Troubleshooting','Other / Not Sure'],'Website Services':['New Website','E-commerce','Website Redesign','Domain / Hosting','Maintenance','Other / Not Sure'],'Excel, Access & Database':['New Excel System','Dashboard','Inventory System','Payroll System','Access Database','Other / Not Sure'],'Cybersecurity':['Security Assessment','Authorized Vulnerability Assessment','Device Security','Network Security','Incident Assistance','Other / Not Sure'],'IT Support & Consultation':['Remote Support','On-Site Support','Technology Consultation','Urgent IT Support','Other / Not Sure']};var selected='Computer Hardware';var recorder=null,chunks=[],audioBlob=null,seconds=0,timer=null;function byId(x){return document.getElementById(x)}function draw(){var s=byId('services');s.innerHTML='';Object.keys(categories).forEach(function(n){var b=document.createElement('button');b.type='button';b.className='svc'+(n===selected?' on':'');b.textContent=n;b.onclick=function(){selected=n;draw()};s.appendChild(b)});byId('problem').innerHTML=categories[selected].map(function(x){return '<option>'+x+'</option>'}).join('')}draw();byId('photos').onchange=function(){var fs=Array.prototype.slice.call(this.files,0,5);byId('photoInfo').textContent=fs.length?fs.length+' photo(s) selected':''};byId('recordBtn').onclick=async function(){if(recorder&&recorder.state==='recording'){recorder.stop();return}try{var stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];audioBlob=null;recorder=new MediaRecorder(stream);recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=function(){audioBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});byId('audioPreview').src=URL.createObjectURL(audioBlob);byId('audioPreview').style.display='block';byId('clearAudio').disabled=false;byId('recordBtn').textContent='🎤 Start Again';clearInterval(timer);stream.getTracks().forEach(function(t){t.stop()});byId('audioStatus').textContent='Recording ready · '+seconds+'s'};recorder.start();seconds=0;byId('recordBtn').textContent='⏹ Stop Recording';timer=setInterval(function(){seconds++;byId('audioStatus').textContent='Recording… '+seconds+'s';if(seconds>=180&&recorder.state==='recording')recorder.stop()},1000)}catch(e){byId('audioStatus').textContent='Microphone unavailable.'}};byId('clearAudio').onclick=function(){audioBlob=null;byId('audioPreview').removeAttribute('src');byId('audioPreview').style.display='none';this.disabled=true;byId('audioStatus').textContent='No recording';byId('recordBtn').textContent='🎤 Start Recording'};window.mtechSubmit=async function(){var msg=byId('message');msg.className='muted';msg.textContent='Button clicked. Preparing request…';var fullName=byId('customerName').value.trim();var phone=byId('customerPhone').value.trim();if(fullName.length<2){msg.className='error';msg.textContent='Please enter your name.';return}if(phone.length<7){msg.className='error';msg.textContent='Please enter a valid phone number.';return}var fd=new FormData();fd.append('full_name',fullName);fd.append('phone',phone);fd.append('email',byId('customerEmail').value.trim());fd.append('area',byId('customerArea').value.trim());fd.append('category_name',selected);fd.append('problem',byId('problem').value);fd.append('description',byId('description').value.trim());fd.append('service_method',byId('serviceMethod').value);Array.prototype.slice.call(byId('photos').files,0,5).forEach(function(f){fd.append('photos',f,f.name)});if(audioBlob)fd.append('audio',audioBlob,'voice-description.webm');var btn=byId('submitBtn');btn.disabled=true;msg.textContent='Submitting securely…';var controller=new AbortController();var timeout=setTimeout(function(){controller.abort()},30000);try{var r=await fetch(API,{method:'POST',body:fd,signal:controller.signal});var data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||('Server returned '+r.status));msg.className='success';msg.textContent='✓ Request received. Reference: '+data.request_no+(data.uploaded?' · '+data.uploaded+' media file(s) attached':'')}catch(e){msg.className='error';msg.textContent=e.name==='AbortError'?'Submission timed out. Please try again.':'Unable to submit: '+(e.message||'Please try again.')}finally{clearTimeout(timeout);btn.disabled=false}};</script></body></html>
