<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1120"><title>M-TECH Password Recovery Center</title><link rel="icon" href="../icon-192.png"><style>body{margin:0;background:#060b16;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:980px;margin:auto;padding:20px}.hero,.card{background:#0d172a;border:1px solid #2f456b;border-radius:22px;padding:18px;margin-bottom:14px}.hero{display:flex;gap:14px;align-items:center}.hero img{width:70px}.muted{color:#9fb1d1}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:linear-gradient(135deg,#12d7d0,#397cf5,#7037e8);color:#fff;cursor:pointer;text-decoration:none}.btn.alt{background:#172642;border:1px solid #36517f}.row{display:grid;grid-template-columns:1.5fr 1.8fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #22324c}.row:last-child{border-bottom:0}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#17243b}.ok{color:#9af0c4}.error{color:#ffaaaa}@media(max-width:680px){.row{grid-template-columns:1fr}.row .btn{width:100%}}</style></head><body><div class="shell"><div class="hero"><img src="../mtech-logo.png" alt="M-TECH"><div><h2 style="margin:0">CEO Password Recovery Center</h2><div class="muted">Send secure password-reset links to approved M-TECH users</div></div></div><div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn alt" href="management.html">Back to Management</a><button class="btn alt" id="refresh">Refresh Users</button></div><p id="msg" class="muted">Checking CEO authorization…</p><div id="list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const REDIRECT='https://johnsonmulbahe-oss.github.io/mtech-website/app/reset-password.html';const sb=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','sb_publishable_vQULGJJZNtuT_MZCSqomiQ_URYS4BQp',{auth:{persistSession:true,autoRefreshToken:true}});const msg=document.getElementById('msg'),list=document.getElementById('list');async function guard(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='management.html';return false}const {data:p}=await sb.from('profiles').select('role,active').eq('id',session.user.id).maybeSingle();if(!p||!p.active||String(p.role).toLowerCase()!=='ceo'){msg.textContent='CEO authorization required.';msg.className='error';list.innerHTML='';return false}return true}async function load(){if(!(await guard()))return;msg.textContent='Loading approved users…';msg.className='muted';const {data,error}=await sb.from('profiles').select('id,email,full_name,role,active').eq('active',true).not('email','is',null).order('full_name');if(error){msg.textContent=error.message;msg.className='error';return}msg.textContent='Only the CEO can use this page. Reset links go directly to each user’s registered email.';list.innerHTML=(data||[]).map(u=>`<div class="row"><b>${esc(u.full_name||'M-TECH User')}</b><span>${esc(u.email||'')}</span><span class="pill">${esc(u.role||'staff')}</span><button class="btn" data-email="${esc(u.email||'')}">Send Reset Link</button></div>`).join('')||'<p class="muted">No active users found.</p>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}list.addEventListener('click',async e=>{const b=e.target.closest('[data-email]');if(!b)return;const email=b.dataset.email;if(!email)return;b.disabled=true;b.textContent='Sending…';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT});if(error){msg.textContent='Could not send recovery email: '+error.message;msg.className='error'}else{msg.textContent='Secure password recovery email sent to '+email+'.';msg.className='ok'}b.disabled=false;b.textContent='Send Reset Link'});document.getElementById('refresh').onclick=load;load()})();</script></body></html>
