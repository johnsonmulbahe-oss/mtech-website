<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-TECH User Access & QR Invites</title><link rel="stylesheet" href="management.css"><style>body{background:#07101f;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#101a2d;border:1px solid #2e3b5d;border-radius:20px;padding:18px}.qr{display:grid;place-items:center;background:#fff;border-radius:18px;padding:14px;min-height:280px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#17395a}.danger{background:#7b1f32!important}.pending{border-left:4px solid #5ce1e6}.muted{color:#aab6d3}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="actions"><a class="btn alt" href="management.html">← Management</a><button id="notifyBtn" class="btn alt">Enable Approval Notifications</button></div><h1>User Access & QR Invites</h1><p class="muted">CEO-only center for creating scan-to-join invitations and approving new users.</p><div class="grid"><section class="card"><h2>Create Invite QR</h2><label>Invite label</label><input id="label" value="M-TECH User Invite"><label>Expires after</label><select id="hours"><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="0">No expiry</option></select><label>Maximum uses</label><input id="uses" type="number" min="1" value="1"><button id="createBtn" class="btn">Create Invite QR</button><p id="createMsg" class="muted"></p><div id="qrWrap" hidden><div class="qr" id="qr"></div><p><b id="inviteLink"></b></p><div class="actions"><button id="copyBtn" class="btn alt">Copy Invite Link</button><button id="shareBtn" class="btn alt">Share</button></div></div></section><section class="card"><h2>Pending Approval Requests</h2><div id="pending"></div></section></div><section class="card" style="margin-top:16px"><h2>Recent Access Requests</h2><div id="all"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const SB=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','sb_publishable_vQULGJJZNtuT_MZCSqomiQ_URYS4BQp',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let lastLink='';async function auth(){const {data}=await SB.auth.getSession();if(!data.session){location.href='management.html';return false}const {data:p}=await SB.from('profiles').select('role,active').eq('id',data.session.user.id).maybeSingle();if(!(p?.active&&String(p.role).toLowerCase()==='ceo')){alert('CEO access required.');location.href='management.html';return false}return true}async function createInvite(){const {data,error}=await SB.rpc('create_user_invite',{p_label:$('label').value,p_expires_hours:Number($('hours').value),p_max_uses:Number($('uses').value)});if(error)return $('createMsg').textContent=error.message;lastLink=location.origin+location.pathname.replace('user-access-admin.html','join-mtech.html')+'?invite='+encodeURIComponent(data.token);$('qr').innerHTML='';new QRCode($('qr'),{text:lastLink,width:250,height:250,correctLevel:QRCode.CorrectLevel.H});$('inviteLink').textContent=lastLink;$('qrWrap').hidden=false;$('createMsg').textContent='Invite created.'}function row(r,buttons=''){return `<div class="card ${r.status==='pending'?'pending':''}" style="margin:10px 0"><b>${esc(r.full_name)}</b> <span class="pill">${esc(r.status)}</span><br><span class="muted">${esc(r.email)} · ${esc(r.phone||'')}</span><br>Requested: ${esc(r.requested_role||'Not specified')} ${esc(r.requested_title||'')}<br><span class="muted">${new Date(r.created_at).toLocaleString()}</span>${buttons}</div>`}async function load(){if(!await auth())return;const {data,error}=await SB.from('user_access_requests').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('pending').innerHTML='<p>'+esc(error.message)+'</p>';return}const rows=data||[];$('pending').innerHTML=rows.filter(r=>r.status==='pending').map(r=>row(r,`<div class="actions" style="margin-top:10px"><button class="btn" onclick="review('${r.id}','approve')">Approve</button><button class="btn danger" onclick="review('${r.id}','reject')">Reject</button></div>`)).join('')||'<p class="muted">No pending requests.</p>';$('all').innerHTML=rows.map(r=>row(r)).join('')||'<p class="muted">No requests yet.</p>'}window.review=async(id,decision)=>{let role='staff',title='',permissions={};if(decision==='approve'){role=prompt('Approved role (staff, technician, finance, manager, admin, trainee):','staff')||'staff';if(String(role).toLowerCase()==='ceo')return alert('CEO role cannot be assigned here.');title=prompt('Title / position (optional):','')||''}if(!confirm((decision==='approve'?'Approve':'Reject')+' this request?'))return;const {data,error}=await SB.rpc('review_user_access_request',{p_request_id:id,p_decision:decision,p_role:role,p_title:title,p_permissions:permissions});if(error)return alert(error.message);alert(decision==='approve'?'Approved. The person can now return to the QR page and complete account setup.':'Request rejected.');load()};$('createBtn').onclick=createInvite;$('copyBtn').onclick=()=>navigator.clipboard.writeText(lastLink);$('shareBtn').onclick=async()=>{if(navigator.share)await navigator.share({title:'M-TECH User Invite',text:'Scan/open to request M-TECH access.',url:lastLink});else navigator.clipboard.writeText(lastLink)};$('notifyBtn').onclick=async()=>{if(!('Notification'in window))return alert('Browser notifications are not supported here.');const p=await Notification.requestPermission();alert(p==='granted'?'Approval notifications enabled on this device.':'Notification permission was not granted.')};let pendingCount=0;async function poll(){if(!document.hidden){const {count}=await SB.from('user_access_requests').select('id',{count:'exact',head:true}).eq('status','pending');if(typeof count==='number'&&count>pendingCount&&pendingCount>=0&&Notification?.permission==='granted')new Notification('M-TECH User Approval',{body:'A new user access request is awaiting your approval.',icon:'../icon-192.png'});pendingCount=count||0}}load().then(poll);setInterval(()=>{load();poll()},30000);</script></body></html>
