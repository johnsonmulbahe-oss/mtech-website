<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11182f"><title>M-TECH Service Request</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#070911;color:#fff}header{padding:18px;background:#0d1324;border-bottom:1px solid #273250}.wrap{max-width:850px;margin:auto;padding:20px}.hero{padding:24px 0}.hero h1{font-size:clamp(34px,7vw,56px);margin:8px 0}.muted{color:#aeb8d5}.card{background:#11182b;border:1px solid #273250;border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:12px 0}input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #34405f;background:#090d18;color:#fff;font:inherit}textarea{min-height:100px}.btn{padding:13px 16px;border:0;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(135deg,#4c8fff,#642dd8)}.btn.secondary{background:#151b30;border:1px solid #34405f}.services{display:grid;grid-template-columns:1fr 1fr;gap:9px}.svc{padding:12px;text-align:left;border:1px solid #34405f;border-radius:11px;background:#0b1020;color:#fff}.svc.on{border-color:#48deda;background:#172444}.eyebrow{color:#48deda;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.success{color:#8ff0b6;font-weight:800;padding:12px;border:1px solid #295d44;border-radius:10px;background:#0d281b}.error{color:#ffb4b4;font-weight:800;padding:12px;border:1px solid #6e3434;border-radius:10px;background:#2b1111}.media{border:1px dashed #3b4a70;border-radius:12px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:650px){.grid,.services{grid-template-columns:1fr}}</style></head><body><header><strong style="font-size:22px">M-TECH</strong><div class="muted">Mulbah Technology Solutions Liberia Ltd.</div></header><main class="wrap"><div class="hero"><div class="eyebrow">With God We Build Solutions</div><h1>Request Technology Service</h1><p class="muted">Choose the service, describe the problem, attach photos or a voice note, and send directly to M-TECH.</p></div><div id="result"></div><form id="requestForm" class="card" action="https://vsirepejlaytbqhhikev.supabase.co/functions/v1/mtech-submit" method="post" enctype="multipart/form-data"><input type="hidden" name="redirect" value="1"><input type="hidden" id="categoryField" name="category_name" value="Computer Hardware"><h2>Customer Service Request</h2><div id="services" class="services"></div><div class="field"><label>Exact problem</label><select id="problem" name="problem"></select></div><div class="field"><label>Written description</label><textarea id="description" name="description"></textarea></div><div class="field"><label>Photos (optional, up to 5)</label><div class="media"><input id="photos" name="photos" type="file" accept="image/*" capture="environment" multiple><div id="photoInfo" class="muted"></div></div></div><div class="field"><label>Voice description (optional)</label><div class="media"><div class="row"><button type="button" class="btn secondary" id="recordBtn">🎤 Start Recording</button><button type="button" class="btn secondary" id="clearAudio" disabled>Remove Recording</button><span id="audioStatus" class="muted">No recording</span></div><audio id="audioPreview" controls style="display:none;width:100%;margin-top:10px"></audio><input id="audioFile" name="audio" type="file" accept="audio/*" style="display:none"></div></div><div class="grid"><div class="field"><label>Your name *</label><input name="full_name" required minlength="2" autocomplete="name"></div><div class="field"><label>Phone / WhatsApp *</label><input name="phone" required minlength="7" inputmode="tel" autocomplete="tel"></div></div><div class="grid"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email"></div><div class="field"><label>How should we assist?</label><select name="service_method"><option>Visit Me / On-Site</option><option>Remote / Online</option><option>I will Bring the Device</option><option>Not Sure Yet</option></select></div></div><div class="field"><label>Area / Organization</label><input name="area"></div><button class="btn" id="submitBtn" type="submit">Submit Request</button><p id="message" class="muted"></p></form></main><script>var cats={'Computer Hardware':['Broken / Cracked Screen','Screen Not Displaying','Motherboard Issue','Keyboard Problem','Battery Problem','Not Charging','Other / Not Sure'],'Computer Software':['Windows Installation','Software Installation','Computer Running Slowly','Virus / Malware Removal','Data Recovery','Other / Not Sure'],'Networking & Internet':['Wi-Fi Not Working','Weak Wi-Fi Signal','Router Configuration','Network Cabling','Other / Not Sure'],'Starlink Services':['New Installation','Relocation','Poor Signal','Router Setup','Troubleshooting','Other / Not Sure'],'Website Services':['New Website','E-commerce','Website Redesign','Domain / Hosting','Maintenance','Other / Not Sure'],'Excel, Access & Database':['New Excel System','Dashboard','Inventory System','Payroll System','Access Database','Other / Not Sure'],'Cybersecurity':['Security Assessment','Authorized Vulnerability Assessment','Device Security','Network Security','Incident Assistance','Other / Not Sure'],'IT Support & Consultation':['Remote Support','On-Site Support','Technology Consultation','Urgent IT Support','Other / Not Sure']};var selected='Computer Hardware';function id(x){return document.getElementById(x)}function draw(){id('services').innerHTML='';Object.keys(cats).forEach(function(n){var b=document.createElement('button');b.type='button';b.className='svc'+(n===selected?' on':'');b.textContent=n;b.onclick=function(){selected=n;id('categoryField').value=n;draw()};id('services').appendChild(b)});id('problem').innerHTML=cats[selected].map(function(x){return '<option>'+x+'</option>'}).join('')}draw();id('photos').onchange=function(){id('photoInfo').textContent=Math.min(this.files.length,5)+(this.files.length===1?' photo selected':' photos selected')};var recorder=null,chunks=[],audioBlob=null,secs=0,timer=null;id('recordBtn').onclick=async function(){if(recorder&&recorder.state==='recording'){recorder.stop();return}try{var stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=function(){audioBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});id('audioPreview').src=URL.createObjectURL(audioBlob);id('audioPreview').style.display='block';id('clearAudio').disabled=false;id('recordBtn').textContent='🎤 Start Again';clearInterval(timer);stream.getTracks().forEach(function(t){t.stop()});id('audioStatus').textContent='Recording ready · '+secs+'s';try{var f=new File([audioBlob],'voice-description.webm',{type:audioBlob.type});var dt=new DataTransfer();dt.items.add(f);id('audioFile').files=dt.files}catch(e){id('audioStatus').textContent+=' · Voice will not attach on this browser'}};recorder.start();secs=0;id('recordBtn').textContent='⏹ Stop Recording';timer=setInterval(function(){secs++;id('audioStatus').textContent='Recording… '+secs+'s';if(secs>=180&&recorder.state==='recording')recorder.stop()},1000)}catch(e){id('audioStatus').textContent='Microphone unavailable.'}};id('clearAudio').onclick=function(){audioBlob=null;id('audioPreview').removeAttribute('src');id('audioPreview').style.display='none';id('audioFile').value='';this.disabled=true;id('audioStatus').textContent='No recording';id('recordBtn').textContent='🎤 Start Recording'};id('requestForm').onsubmit=function(){id('categoryField').value=selected;id('submitBtn').disabled=true;id('message').textContent='Sending request securely…';return true};var q=new URLSearchParams(location.search);if(q.get('success')==='1'){id('result').innerHTML='<p class="success">✓ Request received successfully. Reference: '+String(q.get('request_no')||'')+(q.get('uploaded')?' · '+q.get('uploaded')+' media file(s) attached':'')+'</p>'}else if(q.get('error')){id('result').innerHTML='<p class="error">'+String(q.get('error'))+'</p>'}</script></body></html>
