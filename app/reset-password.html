<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1120"><title>M-TECH Password Recovery</title><link rel="icon" href="../icon-192.png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#152858,#09101f 55%,#050914);color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.card{width:min(92vw,520px);background:rgba(10,18,35,.94);border:1px solid #33496f;border-radius:24px;padding:24px;box-shadow:0 24px 70px #0008}.brand{display:flex;gap:14px;align-items:center}.brand img{width:72px;height:72px;object-fit:contain}.muted{color:#9fb1d1;line-height:1.5}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;font-weight:800}.field input{width:100%;box-sizing:border-box;background:#0d1830;border:1px solid #355184;border-radius:14px;padding:14px;color:#fff;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#13d7d0,#367cf5,#7037e8);color:#fff}.btn.alt{background:#15233f;border:1px solid #39517c}.actions{display:flex;gap:10px;flex-wrap:wrap}.error{color:#ffb3b3}.ok{color:#aaf0cf}.hidden{display:none!important}</style></head><body><div class="card"><div class="brand"><img src="../mtech-logo.png" alt="M-TECH"><div><h2 style="margin:0">M-TECH Password Recovery</h2><div class="muted">Secure password reset for approved CEO and staff accounts</div></div></div><p id="status" class="muted">Verifying your recovery link…</p><div id="form" class="hidden"><div class="field"><label>New Password</label><input id="p1" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label>Confirm New Password</label><input id="p2" type="password" autocomplete="new-password" placeholder="Re-enter password"></div><div class="actions"><button id="save" class="btn">Set New Password</button><a class="btn alt" href="./management.html" style="text-decoration:none">Back to Login</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');const client=supabase.createClient('https://vsirepejlaytbqhhikev.supabase.co','sb_publishable_vQULGJJZNtuT_MZCSqomiQ_URYS4BQp',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let ready=false;function showReady(){ready=true;status.textContent='Recovery verified. Enter a new password below.';status.className='ok';form.classList.remove('hidden')}client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showReady()});const {data}=await client.auth.getSession();if(data.session&&!ready)showReady();setTimeout(()=>{if(!ready){status.textContent='This recovery link is invalid, expired, or has already been used. Request a new password recovery email from the M-TECH login page.';status.className='error'}},1800);save.onclick=async()=>{const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8){status.textContent='Use a password with at least 8 characters.';status.className='error';return}if(p1!==p2){status.textContent='The two passwords do not match.';status.className='error';return}save.disabled=true;save.textContent='Updating…';const {error}=await client.auth.updateUser({password:p1});if(error){status.textContent='Password could not be updated: '+error.message;status.className='error';save.disabled=false;save.textContent='Set New Password';return}await client.auth.signOut();status.textContent='Password updated successfully. You can now sign in with your new password.';status.className='ok';form.innerHTML='<a class="btn" href="./management.html" style="text-decoration:none;display:inline-block">Return to M-TECH Login</a>'}})();</script></body></html>
