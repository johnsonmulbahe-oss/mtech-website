<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | M-TECH Learning Hub</title><link rel="stylesheet" href="/learn/learn.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="/learn/"><img src="/assets/mtech-logo.png" alt="M-TECH"><span>M-TECH<small>Learning Hub</small></span></a><div class="eyebrow" style="margin-top:22px">Free Member Account</div><h1>Create your account</h1><p class="muted">Join the M-TECH Learning Hub and start building practical technology skills.</p><form class="form" id="signup-form"><label>Full name<input name="fullName" autocomplete="name" required maxlength="100"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="160"></label><label>School / College / Institution <span class="muted">(optional)</span><input name="institution" maxlength="160"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required><small class="muted">Use at least 12 characters.</small></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><button class="btn primary" type="submit" id="submit-btn">Create Free Account</button><p class="status" id="status" role="status"></p></form><p class="muted">Already a member? <a href="/learn/login">Log in</a>.</p></section></main><script src="/learn/auth.js" defer></script></body></html>
