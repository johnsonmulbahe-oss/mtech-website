name: Deploy M-TECH App to GitHub Pages

on:
  push:
    branches: [mtech-app-v2]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-mtech-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
